name: Setup mongo-c-driver
description: "Cache and fetch the mongo-c-driver release tarball used by FetchContent"
runs:
  using: "composite"
  steps:
    - name: Exclude the workspace from Windows Defender
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # Real-time MSVC compilation on GitHub-hosted Windows is throttled by
        # Defender; excluding the workspace is the standard, big win.
        Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
        Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\build" -ErrorAction SilentlyContinue

    - name: Restore/save mongo-c-driver tarball
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.mongo-c-driver
        key: mcd-2.5.3-${{ runner.os }}-${{ github.sha }}
        restore-keys: mcd-2.5.3-${{ runner.os }}-

    - name: Ensure mongo-c-driver tarball is present
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/.mongo-c-driver"
        TARBALL="$GITHUB_WORKSPACE/.mongo-c-driver/mongo-c-driver-2.5.3.tar.gz"
        if [ -s "$TARBALL" ]; then
          echo "[bsonjs] mongo-c-driver tarball restored from cache ($(stat -c%s "$TARBALL" 2>/dev/null || stat -f%z "$TARBALL") bytes)"
        else
          echo "[bsonjs] mongo-c-driver tarball not cached; downloading from codeload..."
          curl -fsSL \
               --retry 3 \
               --connect-timeout 30 \
               --max-time 180 \
               -o "$TARBALL" \
               https://github.com/mongodb/mongo-c-driver/archive/refs/tags/2.5.3.tar.gz
          echo "[bsonjs] mongo-c-driver tarball downloaded ($(stat -c%s "$TARBALL" 2>/dev/null || stat -f%z "$TARBALL") bytes)"
        fi
        test -s "$TARBALL" \
          || { echo "::error::mongo-c-driver tarball is missing; cannot build" >&2; exit 1; }
        echo "BSONJS_MCD_TARBALL=$TARBALL" >> "$GITHUB_ENV"
