name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: '17 10 * * 2'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual
          # Compile only our own bsonjs.c, not the vendored libbson/jsonsl
          # sources under bsonjs/{bson,jsonsl,common}. CodeQL's tracer
          # only extracts files the compiler is actually invoked on, and
          # for build-mode: manual, paths-ignore below does not filter
          # results (that only works for interpreted languages or
          # build-mode: none) — so keeping vendored code out of scope
          # means never compiling it here.
          manual-build-command: |
            PYINC=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['include'])")
            gcc -c bsonjs/bsonjs.c -o /tmp/bsonjs.o \
              -Ibsonjs -Ibsonjs/bson -Ibsonjs/jsonsl -Ibsonjs/common -I"$PYINC" \
              -DBSON_COMPILATION=1 -DPy_LIMITED_API=0x03090000 \
              -D_XOPEN_SOURCE=700 -D_BSD_SOURCE=1 -D_DEFAULT_SOURCE=1
        - language: python
          build-mode: none
        - language: actions
          build-mode: none
    steps:
    - uses: mongodb-labs/drivers-github-tools/codeql@d518d2c7d04fdec10266c4218c36791a4fcf98d8 # v3
      with:
        language: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        manual-build-command: ${{ matrix.manual-build-command }}
        config: |
          paths-ignore:
            # Vendored libbson/jsonsl sources, mechanically synced by
            # vendor.sh — not ours to fix findings in.
            - 'bsonjs/bson/**'
            - 'bsonjs/jsonsl/**'
            - 'bsonjs/common/**'
            - 'test/**'
