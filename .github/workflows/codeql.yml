name: "CodeQL"

on:
  push:
    branches: ["master"]
  pull_request:
  schedule:
    - cron: '17 10 * * 2'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual
          # Configure the project so CMake fetches mongo-c-driver and
          # generates libbson's config.h/version.h. Then compile only our own
          # bsonjs.c against that tree. CodeQL's tracer only extracts files the
          # compiler is actually invoked on, so keeping libbson itself out of
          # scope means never compiling it here.
          manual-build-command: |
            if ! command -v cmake >/dev/null 2>&1; then pip install "cmake>=3.17,<4"; fi
            cmake -S . -B /tmp/codeql-build \
              -DENABLE_MONGOC=OFF -DENABLE_SHARED=OFF -DENABLE_STATIC=ON \
              -DENABLE_TESTS=OFF -DBUILD_TESTING=OFF \
              -DENABLE_AUTOMATIC_INIT_AND_CLEANUP=OFF \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_BUILD_TYPE=Release
            PYINC=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['include'])")
            BSONJS_VERSION=$(python3 -c "import re; print(re.search(r'(?m)^version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
            SRC=/tmp/codeql-build/_deps/mongo-c-driver-src
            BIN=/tmp/codeql-build/_deps/mongo-c-driver-build
            gcc -c bsonjs/bsonjs.c -o /tmp/bsonjs.o \
              -Ibsonjs -I"$SRC/src/libbson/src" -I"$SRC/src/libbson/src/bson" \
              -I"$BIN/src/libbson/src" -I"$SRC/src/common/src" -I"$BIN/src/common/src" \
              -I"$PYINC" \
              -DBSON_STATIC -DPy_LIMITED_API=0x03090000 "-DBSONJS_VERSION=\"$BSONJS_VERSION\""
        - language: python
          build-mode: none
        - language: actions
          build-mode: none
    steps:
    - uses: mongodb-labs/drivers-github-tools/codeql@d518d2c7d04fdec10266c4218c36791a4fcf98d8 # v3
      with:
        language: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        manual-build-command: ${{ matrix.manual-build-command }}
        config: |
          paths-ignore:
            - 'test/**'
