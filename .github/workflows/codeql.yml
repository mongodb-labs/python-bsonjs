name: "CodeQL"

on:
  push:
    branches: ["master"]
  pull_request:
  schedule:
    - cron: '17 10 * * 2'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual
          # Configure with Meson so libbson's config.h/version.h are generated.
          # Then compile only our own bsonjs.c against that tree. CodeQL's
          # tracer only extracts files the compiler is actually invoked on, so
          # keeping libbson itself out of scope means never compiling it here.
          manual-build-command: |
            pip install "meson>=1.3" ninja
            MCD=$(python3 scripts/fetch_mongo_c_driver.py --print-srcdir)
            meson setup /tmp/codeql-build
            PYINC=$(python3 -c "import sysconfig; print(sysconfig.get_paths()['include'])")
            BSONJS_VERSION=$(python3 -c "import re; print(re.search(r'(?m)^version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()).group(1))")
            gcc -c bsonjs/bsonjs.c -o /tmp/bsonjs.o \
              -Ibsonjs -I"$MCD/src/libbson/src" -I"$MCD/src/libbson/src/bson" \
              -I/tmp/codeql-build -I"$MCD/src/common/src" \
              -I"$PYINC" \
              -DBSON_STATIC -DPy_LIMITED_API=0x030b0000 "-DBSONJS_VERSION=\"$BSONJS_VERSION\""
        - language: python
          build-mode: none
        - language: actions
          build-mode: none
    steps:
    - uses: mongodb-labs/drivers-github-tools/codeql@f137fdd28483af14ebf466ebc5aa789fbf867218 # v3
      with:
        language: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        manual-build-command: ${{ matrix.manual-build-command }}
        config: |
          paths-ignore:
            - 'test/**'
