name: python-bsonjs

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Build the cp311-abi3 wheel once per platform, as separate jobs so each
  # OS's tests only wait on its own build (not on the others).
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-${{ runner.os }}-wheel-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-wheel-
      - name: Set up mongo-c-driver
        uses: ./.github/actions/setup-mongo-c-driver
      - name: Install build dependencies
        run: python -m pip install "meson-python>=0.17" "meson>=1.2" ninja
      - name: Build wheel
        run: python -m pip wheel --no-build-isolation --no-deps -w dist .
      - name: Show ccache stats
        if: runner.os != 'Windows'
        run: ccache -s
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos
          path: ./dist/*.whl

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-${{ runner.os }}-wheel-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-wheel-
      - name: Set up mongo-c-driver
        uses: ./.github/actions/setup-mongo-c-driver
      - name: Install build dependencies
        run: python -m pip install "meson-python>=0.17" "meson>=1.2" ninja
      - name: Build wheel
        run: python -m pip wheel --no-build-isolation --no-deps -w dist .
      - name: Show ccache stats
        if: runner.os != 'Windows'
        run: ccache -s
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-ubuntu
          path: ./dist/*.whl

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up ccache
        if: runner.os != 'Windows'
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-${{ runner.os }}-wheel-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-wheel-
      - name: Set up mongo-c-driver
        uses: ./.github/actions/setup-mongo-c-driver
      - name: Install build dependencies
        run: python -m pip install "meson-python>=0.17" "meson>=1.2" ninja
      - name: Build wheel
        run: python -m pip wheel --no-build-isolation -Csetup-args=--vsenv --no-deps -w dist .
      - name: Show ccache stats
        if: runner.os != 'Windows'
        run: ccache -s
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-windows
          path: ./dist/*.whl

  # Install the prebuilt wheel and run the tests on every supported Python
  # version. Each platform's tests depend only on that platform's build.
  test-macos:
    needs: build-macos
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-macos
          path: dist
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Test against wheel
        run: |
          python -m pip install "pymongo>=4" pytest dist/*.whl
          pytest

  test-ubuntu:
    needs: build-ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu
          path: dist
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Test against wheel
        run: |
          python -m pip install "pymongo>=4" pytest dist/*.whl
          pytest

  test-windows:
    needs: build-windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-windows
          path: dist
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Test against wheel
        run: |
          python -m pip install "pymongo>=4" pytest dist/*.whl
          pytest
